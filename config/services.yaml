# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\SecretEncryptor:
        arguments:
            $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'
            $legacyKeys: '%env(APP_ENCRYPTION_KEYS_LEGACY)%'

    App\Integration\HelloAsso\HelloAssoClient:
        arguments:
            $httpClient: '@helloasso.client'

    App\Integration\Stripe\StripeClient:
        arguments:
            $httpClient: '@stripe.client'

    App\Payment\CheckoutService:
        arguments:
            $paySiteBaseUrl: '%env(PAY_SITE_BASE_URL)%'

    App\Controller\InternalCheckoutController:
        arguments:
            $internalSecret: '%env(PAY_INTERNAL_SECRET)%'

    App\Controller\Admin\ClientController:
        arguments:
            $paySiteBaseUrl: '%env(PAY_SITE_BASE_URL)%'

    App\Integration\Cyclos\CyclosClient:
        arguments:
            $httpClient: '@cyclos.client'

    App\Notification\NotificationMailer:
        arguments:
            $fromAddress: '%env(MAILER_FROM)%'

    App\Command\PurgePaymentsCommand:
        arguments:
            $defaultRetentionDays: '%env(int:PAYMENT_RETENTION_DAYS)%'

    App\Command\PurgeActivityLogCommand:
        arguments:
            $apiRetentionDays: '%env(int:ACTIVITY_LOG_API_RETENTION_DAYS)%'
            $retentionDays: '%env(int:ACTIVITY_LOG_RETENTION_DAYS)%'

    App\Client\ClientLogoUploader:
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads/client-logos'

    App\Deployment\VersionChecker:
        arguments:
            $cache: '@cache.app'
            $projectDir: '%kernel.project_dir%'
            $upstreamRepo: '%env(GITHUB_UPSTREAM_REPO)%'
            $upstreamBranch: '%env(GITHUB_UPSTREAM_BRANCH)%'
            $githubToken: '%env(GITHUB_TOKEN)%'
            $commitShaOverride: '%env(APP_COMMIT_SHA)%'

    App\Deployment\DeploymentRunner:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Deployment\UpdateLog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Deployment\UpdateLauncher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Backup\DatabaseBackupManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Backup\CodeSnapshot:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Deployment\PaySiteUpdater:
        arguments:
            $paySiteBaseUrl: '%env(PAY_SITE_BASE_URL)%'
            $internalSecret: '%env(PAY_INTERNAL_SECRET)%'

when@test:
    services:
        # Public so functional tests can swap it for a double (container->set()).
        App\Payment\CheckoutService:
            autowire: true
            public: true
            arguments:
                $paySiteBaseUrl: '%env(PAY_SITE_BASE_URL)%'
