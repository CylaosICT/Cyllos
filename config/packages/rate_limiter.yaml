framework:
    rate_limiter:
        # Per-client throttle on the HelloAsso webhook, keyed by the {clientSlug}
        # in the URL. HelloAsso's real payment volume is a trickle, so 30 burst +
        # 30/minute is invisible in normal use but caps a flood aimed at a known
        # client slug (HelloAsso does not sign its notifications).
        webhook:
            policy: 'token_bucket'
            limit: 30
            rate: { interval: '1 minute', amount: 30 }

        # Payment-site -> Cyllos checkout endpoint (HMAC-authenticated). Keyed on
        # the payer's IP, then on the e-mail they typed, so the account-existence
        # pre-check can't be used to enumerate Cyclos accounts.
        internal_checkout:
            policy: 'sliding_window'
            limit: 20
            interval: '10 minutes'
        internal_checkout_email:
            policy: 'sliding_window'
            limit: 5
            interval: '10 minutes'
        # "Confirm your account" step: a bit more room (typos), still bounded.
        internal_account_check:
            policy: 'sliding_window'
            limit: 30
            interval: '10 minutes'
        internal_account_check_email:
            policy: 'sliding_window'
            limit: 10
            interval: '10 minutes'
