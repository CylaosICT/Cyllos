framework:
    http_client:
        scoped_clients:
            # Outbound HelloAsso calls: idempotent reads plus the side-effect-free
            # OAuth2 token POST, so the default retry rules (429/5xx + transport
            # errors, exponential backoff) are safe as-is.
            helloasso.client:
                scope: '.*'
                retry_failed:
                    # 429 is deliberately NOT retried here: immediate retries only made
                    # the rate limiting worse. HelloAssoClient handles it (cool-down +
                    # delayed Messenger retry).
                    http_codes: [423, 425, 500, 502, 503, 504, 507, 510]
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000

            # Outbound Cyclos calls: same rules, but NonMutatingRetryStrategy blocks
            # any retry of the payment POST (see its docblock).
            cyclos.client:
                scope: '.*'
                retry_failed:
                    retry_strategy: App\Http\NonMutatingRetryStrategy
                    max_retries: 3

            # Outbound Stripe calls. The only POST (Checkout Session creation)
            # carries an Idempotency-Key, so retrying 429/5xx/transport errors
            # can never create a second session.
            stripe.client:
                scope: 'https://api\.stripe\.com'
                retry_failed:
                    http_codes: [429, 500, 502, 503, 504]
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
